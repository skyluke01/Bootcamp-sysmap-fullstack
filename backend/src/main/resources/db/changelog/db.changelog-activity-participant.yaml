databaseChangeLog:
  - changeSet:
      id: 3
      author: lucas.mendes
      changes:
        - createTable:
            tableName: activity_participants
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: activity_id
                  type: uuid
                  constraints:
                    nullable: false

              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: varchar(50)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false

              - column:
                  name: checked_in_at
                  type: timestamp

        - addForeignKeyConstraint:
            baseTableName: activity_participants
            baseColumnNames: activity_id
            referencedTableName: activities
            referencedColumnNames: id
            constraintName: fk_activity_participants_activity

        - addForeignKeyConstraint:
            baseTableName: activity_participants
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_activity_participants_user

        - addUniqueConstraint:
            tableName: activity_participants
            columnNames: activity_id, user_id
            constraintName: uk_activity_participant_unique