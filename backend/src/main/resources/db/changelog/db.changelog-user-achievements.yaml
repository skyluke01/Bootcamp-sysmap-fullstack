databaseChangeLog:
  - changeSet:
      id: 5
      author: lucas.mendes
      changes:
        - createTable:
            tableName: user_achievements
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false

              - column:
                  name: type
                  type: varchar(100)
                  constraints:
                    nullable: false

              - column:
                  name: unlocked_at
                  type: timestamp
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: user_achievements
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_user_achievements_user

        - addUniqueConstraint:
            tableName: user_achievements
            columnNames: user_id, type
            constraintName: uk_user_achievement_unique